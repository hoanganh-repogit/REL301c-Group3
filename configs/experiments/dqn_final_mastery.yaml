agent_type: dqn
strategy: fixed_level4_continuous
seed: 0

# Final model chỉ học duy nhất môi trường Level 4.
training_levels:
  - level4

# 0 = chạy liên tục tới khi người dùng Ctrl+C.
max_env_steps: 0
evaluation_enabled: false

# Không chạy eval riêng. Chọn checkpoint tốt nhất bằng điểm trung bình trượt
# của các episode train gần nhất.
best_score_window: 100
best_score_warmup_episodes: 500

save_every_episodes: 250

agent:
  lr: 0.0003
  gamma: 0.995
  batch_size: 256
  buffer_size: 300000
  min_buffer_size_before_train: 5000
  target_update_freq: 5000
  train_frequency: 2
  epsilon_start: 1.0
  epsilon_end: 0.01
  epsilon_decay_steps: 400000
  hidden_dim: 256
  gradient_clip_norm: 10.0
  balanced_replay: false
